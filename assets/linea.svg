<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 20" width="100%" height="100%">
  <defs>
    <style>
      .animated-line {
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        /* Comienza rápido y desacelera suavemente durante 1.2 segundos */
        animation: drawLine 1.0s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      }

      @keyframes drawLine {
        to {
          stroke-dashoffset: 0;
        }
      }
    </style>
  </defs>

  
  <line class="animated-line" x1="0" y1="10" x2="1000" y2="10" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
</svg>